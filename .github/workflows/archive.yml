name: archive

on:
  schedule:
    - cron: "7 1 * * *"   # every day at 09:07 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency: archive

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the boards
        env:
          OKDATA_API_KEY: ${{ secrets.OKDATA_API_KEY }}
          BOARDS: ${{ vars.BOARDS || 'douyin' }}
        run: |
          if [ -z "$OKDATA_API_KEY" ]; then
            echo "::notice::Add an OKDATA_API_KEY repository secret to start archiving."
            exit 0
          fi
          rc=0
          for board in $BOARDS; do python archive.py --board "$board" || rc=1; done
          exit $rc
      - name: Commit new snapshots
        if: always()
        run: |
          [ -d data ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: hot search $(date -u +%F)"
          git push
